<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1529" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="green-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Path Gradients -->
    <linearGradient id="traj-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="traj-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f6fc" />
      <stop offset="70%" stop-color="#38d9a9" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#00f0ff" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 800; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 8px #00f0ff); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      .anim-traj-1 {
        stroke-dasharray: 120 40;
        animation: dashFlow 12s linear infinite;
      }
      .anim-traj-2 {
        stroke-dasharray: 80 30;
        animation: dashFlow 9s linear infinite reverse;
      }
      .anim-node {
        transform-origin: center;
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .anim-node-delayed {
        transform-origin: center;
        animation: pulseNode 4s ease-in-out infinite 1.8s;
      }
      .anim-glow {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .anim-float {
        animation: waveFloat 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Ambient Glows -->
  <rect width="1200" height="420" rx="16" fill="url(#cyan-glow)" class="anim-glow" />
  <rect width="1200" height="420" rx="16" fill="url(#purple-glow)" class="anim-glow" />
  <rect width="1200" height="420" rx="16" fill="url(#green-glow)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Spline Curves (Motion Planning Trajectories & Optimization Curves) -->
  <g opacity="0.75">
    <path class="anim-traj-1" d="M -50,330 C 200,380 350,160 550,220 C 750,280 900,100 1250,140" fill="none" stroke="url(#traj-grad-1)" stroke-width="2.5" />
    <path class="anim-traj-2" d="M -50,110 C 250,60 400,300 650,240 C 900,180 1020,340 1250,290" fill="none" stroke="url(#traj-grad-2)" stroke-width="2" />
  </g>

  <!-- Robot Kinematic Joint Graph (Articulated Bodies & Factor Graphs) -->
  <g opacity="0.45">
    <!-- Links -->
    <line x1="120" y1="140" x2="190" y2="80" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="190" y1="80" x2="270" y2="120" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="270" y1="120" x2="220" y2="200" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="120" y1="140" x2="150" y2="230" stroke="#00ff9d" stroke-width="1.5" stroke-dasharray="4 3" />

    <line x1="980" y1="280" x2="1050" y2="210" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="1050" y1="210" x2="1120" y2="260" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="1050" y1="210" x2="1020" y2="130" stroke="#00ff9d" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Articulation Nodes -->
    <circle cx="120" cy="140" r="4.5" fill="#00f0ff" class="anim-node" />
    <circle cx="190" cy="80" r="6" fill="#00ff9d" class="anim-node-delayed" />
    <circle cx="270" cy="120" r="5" fill="#7000ff" class="anim-node" />
    <circle cx="220" cy="200" r="4" fill="#00f0ff" class="anim-node-delayed" />
    <circle cx="150" cy="230" r="5.5" fill="#38d9a9" class="anim-node" />

    <circle cx="980" cy="280" r="5" fill="#7000ff" class="anim-node" />
    <circle cx="1050" cy="210" r="6.5" fill="#00f0ff" class="anim-node-delayed" />
    <circle cx="1120" cy="260" r="4" fill="#00ff9d" class="anim-node" />
    <circle cx="1020" cy="130" r="5.5" fill="#38d9a9" class="anim-node-delayed" />
  </g>

  <!-- Subtle Dark Center Plate to guarantee 100% foreground clarity and legibility -->
  <rect x="160" y="55" width="880" height="310" rx="20" fill="#070c1a" fill-opacity="0.78" stroke="#1e2c4f" stroke-width="1" />

  <!-- FOREGROUND CONTENT (Protected, crisp, uncluttered) -->
  <g class="anim-float">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 105)">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#0d1b38" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="-152" cy="0" r="4" fill="#00ff9d" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">ROBOTICS SCIENTIFIC COMPUTING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.6))">
      Awesome Robotics Scientific Computing
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
      Rigid Body Dynamics • Nonlinear Optimization • Motion Planning • Physics Simulation
    </text>

    <!-- Feature Pillars (Pills) -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: Dynamics -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚙️ Dynamics</text>
      </g>
      <!-- Pill 2: Optimization -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">📈 Optimization</text>
      </g>
      <!-- Pill 3: Motion Planning -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">🧭 Planning</text>
      </g>
      <!-- Pill 4: Simulation -->
      <g transform="translate(160, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">🎮 Simulation</text>
      </g>
      <!-- Pill 5: State Estimation -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">📡 Estimation</text>
      </g>
    </g>

    <!-- Category Leaders Footer line -->
    <text x="600" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">
      Featuring Pinocchio • Drake • CasADi • MuJoCo • OMPL • GTSAM • SciPy • Chrono
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#253556" stroke-width="1.5" />
</svg>
